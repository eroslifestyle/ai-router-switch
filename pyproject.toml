[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-router-switch"
version = "0.1.0"
description = "Proxy di routing self-hosted per Claude Code e client Anthropic; commuta fra Anthropic, MiniMax, GLM/z.ai, Qwen e backend locale, con failover, compressione del contesto e isolamento per chat."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "aiohttp",
    "brotli",
    "multidict",
    "Pillow",
]

[project.urls]
Repository = "https://github.com/eroslifestyle/ai-router-switch"

[project.optional-dependencies]
gui = ["PySide6"]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]
keyring = ["keyring"]

[tool.setuptools]
# Codice sorgente in src/ ma NON è un package installabile:
# - i moduli si importano per nome piatto (import paths, import router_constants)
# - src/ è nel sys.path a runtime
# - src/ai-router-proxy.py ha un TRATTINO nel nome (non è identificatore Python)
# py-modules vuoto = niente auto-discovery, nessun pacchetto installato
packages = []

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["sviluppo/tests", "tests"]
asyncio_mode = "strict"
