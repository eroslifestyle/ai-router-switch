[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-router-switch"
version = "1.1.0"
description = "Proxy di routing self-hosted per Claude Code e client Anthropic; commuta fra Anthropic, MiniMax, GLM/z.ai, Qwen e backend locale, con failover, compressione del contesto e isolamento per chat."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "aiohttp",
    "brotli",
    "multidict",
    "Pillow",
]

[project.urls]
Repository = "https://github.com/eroslifestyle/ai-router-switch"

[project.optional-dependencies]
gui = ["PySide6"]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]
keyring = ["keyring"]

[tool.setuptools]
# Codice sorgente in src/ ma NON è un package installabile:
# - i moduli si importano per nome piatto (import paths, import router_constants)
# - src/ è nel sys.path a runtime
# - src/ai-router-proxy.py ha un TRATTINO nel nome (non è identificatore Python)
# py-modules vuoto = niente auto-discovery, nessun pacchetto installato
packages = []

[tool.ruff]
line-length = 120
target-version = "py310"

# E402 = import non in cima al file. Nei file elencati l'ordine e' DELIBERATO,
# non una svista: il proxy e i moduli che ne dipendono devono impostare
# `sys.path` prima di importare i moduli interni, e gli harness di test devono
# esportare le variabili d'ambiente prima di importare i moduli di `src/`, che
# le leggono al momento dell'import.
# Perche' una regola esplicita invece di 24 avvisi ricorrenti: un elenco muto
# di avvisi "da ignorare" fa perdere di vista quelli nuovi. Con l'eccezione
# dichiarata qui, `ruff check .` torna pulito e qualunque avviso che compaia in
# futuro e' un avviso vero. Se il proxy verra' riorganizzato, questa lista va
# rivista insieme, non prima.
[tool.ruff.lint.per-file-ignores]
"src/ai-router-proxy.py" = ["E402"]
"src/model_context_map.py" = ["E402"]
"src/router_utils.py" = ["E402"]
"sviluppo/tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["sviluppo/tests", "tests"]
asyncio_mode = "strict"
